    <title>Isensix Technician Calendar</title>
    <script>
      (() => {
        let theme = 'dark';
        try {
          theme = localStorage.getItem('isensix_theme') === 'light' ? 'light' : 'dark';
        } catch (_) {}
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
